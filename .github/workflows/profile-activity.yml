name: Update profile activity

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render contribution card
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/update_activity.py
      - name: Commit updated card
        run: |
          git add activity.svg top-languages.svg
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update profile activity'
          git push
