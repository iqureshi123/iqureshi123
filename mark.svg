<svg xmlns="http://www.w3.org/2000/svg" width="760" height="328" viewBox="0 0 760 328" role="img" aria-labelledby="bench-title bench-desc">
  <title id="bench-title">tinyinfer, measured</title>
  <desc id="bench-desc">Two measurements from a from-scratch NumPy inference path for Qwen2.5-0.5B-Instruct. Against llama.cpp on matched fp32 CPU weights, tinyinfer is 1.14 times behind. After a one-line fix, np.sqrt returned a float64 scalar and promoted the attention scale, the tests still passed because float64 is more precise, and decode was 1.95 times faster: 26.2 tokens per second on an Apple M5. Longer bars are faster.</desc>
  <rect width="760" height="328" rx="16" fill="#10140f"/>
  <rect x="0.75" y="0.75" width="758.5" height="326.5" rx="16" fill="none" stroke="#d6ff4a" stroke-opacity="0.45" stroke-width="1.5"/>
  <g font-family="ui-monospace, Cascadia Mono, DejaVu Sans Mono, Liberation Mono, monospace">
    <line x1="24" y1="16" x2="736" y2="16" stroke="#d6ff4a" stroke-width="2" stroke-linecap="round"/>
    <text x="24" y="42" fill="#d6ff4a" font-size="15" font-weight="600">tinyinfer</text>
    <text x="584" y="42" fill="#8b977c" font-size="12">qwen2.5-0.5b-instruct</text>

    <rect x="16" y="58" width="356" height="254" rx="12" fill="#171e14" stroke="#2c3a24" stroke-width="1"/>
    <rect x="388" y="58" width="356" height="254" rx="12" fill="#171e14" stroke="#2c3a24" stroke-width="1"/>

    <text x="32" y="84" fill="#8b977c" font-size="11" letter-spacing="1.2">AGAINST LLAMA.CPP</text>
    <text x="32" y="128" fill="#d6ff4a" font-size="44" font-weight="600">1.14×</text>
    <text x="32" y="156" fill="#e4efd2" font-size="14">still behind</text>
    <text x="32" y="176" fill="#8b977c" font-size="13">same fp32 weights</text>
    <text x="32" y="208" fill="#8b977c" font-size="12">llama.cpp</text>
    <rect x="32" y="216" width="308" height="8" rx="2" fill="#31402a"/>
    <rect x="32" y="216" width="308" height="8" rx="2" fill="#6a7d4a"/>
    <text x="32" y="244" fill="#d6ff4a" font-size="12">tinyinfer</text>
    <rect x="32" y="252" width="308" height="8" rx="2" fill="#31402a"/>
    <rect x="32" y="252" width="270.2" height="8" rx="2" fill="#d6ff4a"/>
    <text x="32" y="288" fill="#9aaf88" font-size="12">numpy · cpu</text>

    <text x="404" y="84" fill="#8b977c" font-size="11" letter-spacing="1.2">AFTER THE FLOAT64 FIX</text>
    <text x="404" y="128" fill="#d6ff4a" font-size="44" font-weight="600">1.95×</text>
    <text x="404" y="156" fill="#e4efd2" font-size="14">np.sqrt promoted the scale</text>
    <text x="404" y="176" fill="#8b977c" font-size="13">tests still passed</text>
    <text x="404" y="208" fill="#8b977c" font-size="12">before</text>
    <rect x="404" y="216" width="308" height="8" rx="2" fill="#31402a"/>
    <rect x="404" y="216" width="157.9" height="8" rx="2" fill="#6a7d4a"/>
    <text x="404" y="244" fill="#d6ff4a" font-size="12">after</text>
    <rect x="404" y="252" width="308" height="8" rx="2" fill="#31402a"/>
    <rect x="404" y="252" width="308" height="8" rx="2" fill="#d6ff4a"/>
    <text x="404" y="288" fill="#9aaf88" font-size="12">26.2 tok/s on an m5</text>
  </g>
</svg>
