<svg xmlns="http://www.w3.org/2000/svg" width="680" height="176" viewBox="0 0 680 176" role="img" aria-labelledby="name-title name-desc">
  <title id="name-title">Ibrahim Qureshi</title>
  <desc id="name-desc">Computer Engineering. Interested in machine learning and robotics. Open to Summer 2027 internships.</desc>
  <style>
    .name{fill:#edf0f6;font-family:'Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:50px;font-weight:650;letter-spacing:-1.5px}
    .degree{fill:#aeb6bf;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:19px;font-weight:500}
    .focus{fill:url(#ambient-type);font-family:'Avenir Next',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:25px;font-weight:500;letter-spacing:-.25px}
    .interest{opacity:1}.availability{opacity:0}
    @media(prefers-reduced-motion:no-preference){
      .interest,.availability{animation:rotate 16s cubic-bezier(.22,1,.36,1) infinite}
      .availability{animation-delay:-8s}
      @keyframes rotate{
        0%{opacity:0;transform:translateY(5px)}
        4%,43%{opacity:1;transform:translateY(0)}
        49%{opacity:0;transform:translateY(-5px)}
        50%,100%{opacity:0;transform:translateY(5px)}
      }
    }
    @media(prefers-reduced-motion:reduce){.interest{opacity:0}.availability{opacity:1}}
  </style>
  <defs>
    <linearGradient id="ambient-type" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a7bddb"/><stop offset=".55" stop-color="#bbb0cf"/><stop offset="1" stop-color="#a3c3cb"/>
    </linearGradient>
    <radialGradient id="ambient-field" cx="50%" cy="55%" r="65%">
      <stop stop-color="#667994" stop-opacity=".08"/><stop offset="1" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="680" height="176" rx="8" fill="#0d1117"/>
  <rect width="680" height="176" rx="8" fill="url(#ambient-field)"/>
  <text class="name" x="340" y="64" text-anchor="middle">Ibrahim Qureshi</text>
  <text class="degree" x="340" y="98" text-anchor="middle">Computer Engineering</text>
  <g class="focus" text-anchor="middle">
    <text class="interest" x="340" y="142">Machine learning + robotics</text>
    <text class="availability" x="340" y="142">Open to Summer ’27 internships</text>
  </g>
</svg>
